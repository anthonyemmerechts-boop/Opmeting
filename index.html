<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A5FAD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Opmeting per positie op de tablet voor Ve.Ra+">
<title>Ve.Ra+ Werfopmeting</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: werkbalk bovenaan, één positie per scherm in stappen, grote tikvlakken (min. 52px) voor gebruik met één hand. */
:root{
  --bg:#EEF2F7; --panel:#FFFFFF; --ink:#152232; --muted:#5D6D80; --line:#C9D5E4;
  --accent:#1A5FAD; --accent-ink:#FFFFFF; --accent-soft:#DCE8F7; --calc:#E3EFD8; --calc-ink:#2E5A16;
  --warn:#B4531A; --bad:#C8321E; --ok:#2F7D3A;
  --f-display:"Roboto Condensed","sans-serif-condensed","Arial Narrow",Arial,sans-serif;
  --f-body:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --tap:52px; --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1720; --panel:#17222E; --ink:#E7EEF6; --muted:#97A7BA; --line:#2D3C4D;
  --accent:#5B9BE8; --accent-ink:#0B1420; --accent-soft:#1E3550; --calc:#1F3320; --calc-ink:#A6D58A;
  --warn:#F0A060; --bad:#F27C68; --ok:#7CCB86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1720; --panel:#17222E; --ink:#E7EEF6; --muted:#97A7BA; --line:#2D3C4D;
  --accent:#5B9BE8; --accent-ink:#0B1420; --accent-soft:#1E3550; --calc:#1F3320; --calc-ink:#A6D58A;
  --warn:#F0A060; --bad:#F27C68; --ok:#7CCB86; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;white-space:nowrap}
.bar .werfname{font-family:var(--f-display);font-weight:600;font-size:17px;opacity:.92;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.bar button{background:transparent;border:1.5px solid color-mix(in srgb,var(--accent-ink) 55%,transparent);color:var(--accent-ink);
  border-radius:8px;min-height:44px;padding:0 14px;font-weight:600;cursor:pointer}
.bar button[aria-current="true"]{background:var(--accent-ink);color:var(--accent)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px;max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:22px;font-weight:700}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0;flex:1}
input.t,select.t,textarea.t{min-height:var(--tap);border:1.5px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 12px;font-size:18px;
  text-transform:none;letter-spacing:0;font-weight:500;width:100%;min-width:0}
textarea.t{min-height:140px;resize:vertical;line-height:1.4}
input.t:focus,select.t:focus,textarea.t:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.num{font-variant-numeric:tabular-nums;text-align:center;font-size:22px;font-weight:600}
/* positie-strook */
.posstrip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.chip{flex:0 0 auto;min-height:var(--tap);min-width:64px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);
  font-family:var(--f-display);font-weight:700;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.chip .dot.done{background:var(--ok)}
.chip.add{border-style:dashed;color:var(--accent)}
/* stappen */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.steps button{min-height:var(--tap);border:1.5px solid var(--line);background:var(--panel);border-radius:8px;font-family:var(--f-display);
  font-weight:700;font-size:17px;cursor:pointer;padding:0 6px}
.steps button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.steps small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted)}
/* maten */
.mgrid{display:grid;grid-template-columns:44px 1fr 1fr;grid-template-rows:auto repeat(3,auto) auto;gap:8px 10px;align-items:center}
.mgrid .hd{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-align:center}
.mgrid .lbl{font-family:var(--f-display);font-weight:700;font-size:22px;grid-row:2 / span 3}
.mcol{display:grid;gap:8px}
.calc{background:var(--calc);color:var(--calc-ink);border-radius:8px;min-height:40px;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.calc small{font-weight:500;font-size:11px;margin-right:6px;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
.pm{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pm input{font-size:30px;min-height:64px;border-width:2px;border-color:var(--accent)}
.pm .x{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--accent)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button,.btn{min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);padding:0 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
/* keuzetegels */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:var(--tap);min-width:var(--tap);padding:0 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);
  font-weight:600;font-size:16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pkt{display:grid;grid-template-columns:96px 1fr;gap:10px 10px;align-items:center}
.pktl{display:flex;flex-direction:column;line-height:1.1}.pktl small{font-size:12px;color:var(--muted);font-weight:600}
.pkt b{font-family:var(--f-display);font-size:22px}
.door{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.door button{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:14px}
.door button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.door svg{width:100%;max-width:84px;height:auto}
.door svg .wall{stroke:var(--ink);stroke-width:5}
.door svg .leaf{stroke:currentColor;stroke-width:3.5}
.door svg .arc{stroke:currentColor;stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.door svg text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.lens{display:grid;gap:8px}
.lens .l{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;min-height:var(--tap);border:1.5px solid var(--line);border-radius:8px;padding:0 12px;cursor:pointer;background:var(--panel)}
.lens .l[aria-pressed="true"]{border-color:var(--accent)}
.lens .box{width:26px;height:26px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-weight:800;color:var(--accent-ink)}
.lens .l[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.lens .v{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--calc-ink);background:var(--calc);border-radius:6px;padding:4px 10px;min-width:84px;text-align:center}
/* foto's */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.photo{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--bg);max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:20px;cursor:pointer}
.addphoto{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;border:2px dashed var(--accent);color:var(--accent);
  border-radius:8px;aspect-ratio:4/3;font-weight:700;cursor:pointer;background:var(--accent-soft);text-align:center;padding:8px}
.addphoto input{position:absolute;width:1px;height:1px;opacity:0}
/* onderbalk */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.foot .btn{min-height:var(--tap);font-size:17px;flex:1;max-width:260px}
.foot .mid{flex:1;text-align:center;color:var(--muted);font-size:14px;min-width:0}
.ex{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
table.ov{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.ov th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1.5px solid var(--line)}
table.ov td{padding:10px 8px;border-bottom:1px solid var(--line)}
table.ov tr{cursor:pointer}
.scroll{overflow-x:auto}
.state{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.state i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.state.done i{background:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.werflist{display:grid;gap:10px}
.werfitem{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;width:100%}
.werfitem b{font-family:var(--f-display);font-size:20px}
.offpanel{background:var(--accent-soft);border-color:transparent}
.offr{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid color-mix(in srgb,var(--accent) 18%,transparent);font-size:15px}
.offr:last-child{border-bottom:0}
.offr span{color:var(--muted);font-size:13px}
.offr b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.copybar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chk{border-radius:8px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.chk ul{margin:0 0 4px;padding-left:20px}.chk li{margin:2px 0}
.chk .bad,.bad{color:var(--bad)}.chk .wrn,.wrn{color:var(--warn)}
.chk.ok{background:var(--calc);color:var(--calc-ink)}
.pmwarn{display:flex;flex-direction:column;gap:6px}
.lw{background:color-mix(in srgb,var(--warn) 14%,var(--panel));color:var(--ink);border-left:4px solid var(--warn);border-radius:6px;padding:8px 10px;font-size:14px;font-weight:600}
.sigwrap{position:relative;border:1.5px dashed var(--line);border-radius:8px;overflow:hidden;background:#fff;touch-action:none}
.sigwrap canvas{display:block;touch-action:none}
.siglab{position:absolute;left:10px;bottom:6px;font-size:12px;color:#7A8899;pointer-events:none}
.skwrap{position:relative;width:100%;max-width:max(320px,calc((100dvh - 290px) * 1.3333));margin:0 auto;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;touch-action:none}
.skwrap canvas{display:block;touch-action:none;cursor:crosshair}
.sklabel{position:absolute;left:10px;bottom:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7A8899;pointer-events:none}
.seg .sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:1.5px solid rgba(255,255,255,.7)}
@media (max-width:560px){.steps{grid-template-columns:repeat(3,1fr)}.door{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <span class="brand">Ve.Ra +</span>
  <span class="werfname" id="werfname">Werfopmeting</span>
  <button type="button" id="nav-werven">Werven</button>
  <button type="button" id="nav-werf">Werf</button>
  <button type="button" id="nav-pos">Posities</button>
  <button type="button" id="nav-ov">Overzicht</button>
</header>
<main id="app"></main>
<div class="foot" id="foot" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- opslag (IndexedDB, met geheugen als terugval) ---------- */
const mem = {};
let dbp = null;
function idb(){
  if (dbp) return dbp;
  dbp = new Promise(res=>{
    try{
      const r = indexedDB.open("vera-werfopmeting",1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore("kv"); };
      r.onsuccess = ()=>res(r.result); r.onerror = ()=>res(null);
    }catch(e){ res(null); }
  });
  return dbp;
}
async function put(k,v){ mem[k]=v; const d=await idb(); if(!d) return; try{ d.transaction("kv","readwrite").objectStore("kv").put(v,k);}catch(e){} }
async function get(k){ const d=await idb(); if(!d) return mem[k]; return new Promise(res=>{ try{ const q=d.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(mem[k]); }catch(e){res(mem[k]);} }); }
async function del(k){ delete mem[k]; const d=await idb(); if(!d) return; try{ d.transaction("kv","readwrite").objectStore("kv").delete(k);}catch(e){} }

/* ---------- model ---------- */
const uid = ()=>Math.random().toString(36).slice(2,10);
const blank3 = ()=>["","",""];
function newPos(kind,nr){
  return {id:uid(),nr:String(nr||""),kind,plaats:"",type:"",verdieping:"",gevel:"",offB:"",offH:"",bijkomend:false,
    dm:{b:blank3(),h:blank3()},bm:{b:blank3(),h:blank3()},bi:"",bu:"",bibuM:"",a:"",d:"",hneq:"",
    P:[],K:[],T:[],pmB:"",pmH:"",vp:"",krukH:"",vd:"",vloerAf:false,
    dorpel:"",kruk:"",scharnieren:"",soudage:false,infoprod:"",opties:"",verbrL:"",verbrR:"",acc:[],
    draai:"",slot:"",cilinder:"",paneel:"",
    binnen:"",binnenBr:"",tablet:"",tabletMaat:"",buitendorpel:"",bdD:"",
    rlType:"",rlB:"",rlH:"",rlBed:"",rlZijde:"",notes:"",photos:[],sketch:{items:[]},done:false};
}
function newWerf(){
  return {id:uid(),klant:"",offerte:"",adres:"",tel:"",datum:new Date().toISOString().slice(0,10),
    systeem:"Deceuninck Elegant 76",kleurBu:"",kleurBi:"",beslag:"",glas:"",
    check:[],posities:[newPos("raam",1)],updated:Date.now()};
}
function exampleWerf(){
  const w = newWerf(); w.example=true; w.klant="Voorbeeldwerf"; w.offerte="VOORBEELD"; w.adres="Stationsstraat 1, Aalst";
  w.kleurBu="Grafietzwart"; w.kleurBi="Crème";
  const p1 = newPos("raam",1); Object.assign(p1,{plaats:"Living",type:"Vast + draaikip",verdieping:"0",gevel:"Voor",offB:"2150",offH:"1500",
    dm:{b:["2141,6","2138,2","2143,0"],h:["1469,3","1471,0",""]},bm:{b:["2162,4","",""],h:["1427,4","",""]},
    pmB:"2150",pmH:"1500",dorpel:"5183 (74)",kruk:"Victory 9004",scharnieren:"Verdekt",soudage:true,infoprod:"Ja",
    binnen:"Chambrant",binnenBr:"70",tablet:"PVC wit",rlType:"Rolluik",acc:["dorpel","inloop","verst"],
    notes:"Tegels onder vensterbank wegnemen. Klant wil kruk zo laag mogelijk.",done:true});
  const p2 = newPos("deur",2); Object.assign(p2,{plaats:"Inkomhal",type:"Enkel binnendraaiend",verdieping:"0",gevel:"Voor",offB:"1100",offH:"2100",
    dm:{b:["1100","1098,5",""],h:["2100","",""]},bm:{b:["1116","",""],h:["2114","",""]},pmB:"1140",pmH:"2110",draai:"binnen L",slot:"5-punt",vd:"0"});
  const p3 = newPos("raam",3); Object.assign(p3,{plaats:"Badkamer",type:"Draaikip - 1 vleugel",verdieping:"1",gevel:"Zij R",offB:"700",offH:"800"});
  w.posities=[p1,p2,p3];
  return w;
}

/* ---------- toestand ---------- */
let index = [];            // [{id,klant,offerte,updated,example}]
let werf = null;
let curPos = 0, step = "maten", view = "werven";
let saveT = null;
function scheduleSave(){
  if(!werf) return;
  werf.updated = Date.now();
  clearTimeout(saveT);
  saveT = setTimeout(async ()=>{
    await put("werf:"+werf.id, werf);
    const i = index.findIndex(x=>x.id===werf.id);
    const meta = {id:werf.id,klant:werf.klant,offerte:werf.offerte,updated:werf.updated,example:!!werf.example,n:werf.posities.length};
    if(i<0) index.unshift(meta); else index[i]=meta;
    await put("index",index);
    put("last",{werf:werf.id,pos:curPos,step,view});
  },350);
}

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v=>{ const s=String(v==null?"":v).replace(",",".").trim(); if(s==="") return NaN; return parseFloat(s); };
function minOf(arr){ const v=arr.map(num).filter(x=>!isNaN(x)); return v.length?Math.floor(Math.min(...v)):""; }
function lens(p){
  const B=num(p.pmB), H=num(p.pmH); const ok=x=>!isNaN(x);
  const vl=num(p.verbrL)||0, vr=num(p.verbrR)||0;
  if(p.kind==="deur") return [["dorpel","Dorpel / strip",ok(B)?Math.round(B):""],["koppel","Koppelprofiel",ok(H)?Math.round(H):""]];
  return [["dorpel","Buitendorpel",ok(B)?Math.round(B-vl-vr):""],["inloop","Inloopstuk (PM − 80)",ok(B)?Math.round(B-80):""],
    ["verst","Versterking (PM − 120)",ok(B)?Math.round(B-120):""],["dagkant","Dagkant 2× H + 1× B",ok(B)&&ok(H)?`${Math.round(H)} / ${Math.round(B)}`:""]];
}
function getPath(o,path){ return path.split(".").reduce((a,k)=>a==null?a:a[k],o); }
function setPath(o,path,v){ const ks=path.split("."); const last=ks.pop(); const t=ks.reduce((a,k)=>a[k],o); t[last]=v; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function P(){ return werf.posities[curPos]; }

/* ---------- weergaven ---------- */
function render(){
  document.querySelectorAll(".bar button").forEach(b=>b.setAttribute("aria-current","false"));
  const nb = {werven:"#nav-werven",werf:"#nav-werf",pos:"#nav-pos",ov:"#nav-ov"}[view]; if(nb) $(nb).setAttribute("aria-current","true");

    <line class="leaf" x1="${hx}" y1="${y}" x2="${hx}" y2="${ly}"/>
    <path class="arc" d="M ${hx} ${ly} A ${r} ${r} 0 0 ${sweep} ${ex} ${y}"/></svg>`;

function updateCalc(){
  const p=P(); if(!p) return;
  document.querySelectorAll("[data-calc]").forEach(el=>{ const [k,d]=el.dataset.calc.split("."); const v=minOf(p[k][d]); el.querySelector("span").textContent=v===""?"–":v; });
  const L=lens(p); document.querySelectorAll("[data-len]").forEach(el=>{ const r=L.find(x=>x[0]===el.dataset.len); el.textContent=r&&r[2]!==""?r[2]:"–"; });
  liveWarn();
}

/* ---------- controles, draaizijde, overnemen, handtekening ---------- */
function draaiOpts(p){
  const t=(p.type||"").toLowerCase();
  if(p.kind!=="raam" || !t || /^vast raam/.test(t) || /valraam/.test(t)) return null;
  if(/schuif/.test(t)) return ["Schuivend links","Schuivend rechts"];
  if(/2 vleugels/.test(t)) return ["Krukvleugel links","Krukvleugel rechts"];
  return ["Scharnieren links","Scharnieren rechts"];
}
function spread(arr){ const v=arr.map(num).filter(x=>!isNaN(x)); return v.length>1?Math.round(Math.max(...v)-Math.min(...v)):0; }
function checkPos(p){
  const miss=[], warn=[];
  if(!p.pmB||!p.pmH) miss.push("PM (bestelmaat)");
  if(!p.dm.b.some(x=>String(x).trim())||!p.dm.h.some(x=>String(x).trim())) miss.push("Dagmaat (DM)");
  if(draaiOpts(p) && !p.draaizijde) miss.push("Draaizijde raam");
  if(p.kind==="deur" && !p.draai) miss.push("Draairichting deur");
  if(!p.dorpel) miss.push("Dorpel");
  const dev=(pm,off,lab)=>{ const a=num(pm), b=num(off); if(isNaN(a)||isNaN(b)||!b) return; const d=Math.round(a-b);
    if(Math.abs(d)>30 || Math.abs(d)/b>0.03) warn.push(`PM ${lab} wijkt ${d>0?"+":""}${d} mm af van de offerte (${off})`); };
  dev(p.pmB,p.offB,"breedte"); dev(p.pmH,p.offH,"hoogte");

function skDraw(ctx,W,H,items,grid){
  ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,0,W,H);
  if(grid){ ctx.strokeStyle="#E3E9F2"; ctx.lineWidth=1; const s=W/32;
    for(let x=s;x<W;x+=s){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let y=s;y<H;y+=s){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); } }
  ctx.lineCap="round"; ctx.lineJoin="round";
  for(const it of items){
    const lw=(it.w||3)*W/800; ctx.strokeStyle=it.c; ctx.fillStyle=it.c; ctx.lineWidth=lw;
    if(it.t==="pen"&&it.pts.length){ ctx.beginPath(); ctx.moveTo(it.pts[0][0]*W,it.pts[0][1]*H);
      for(const q of it.pts.slice(1)) ctx.lineTo(q[0]*W,q[1]*H); if(it.pts.length===1) ctx.lineTo(it.pts[0][0]*W+0.1,it.pts[0][1]*H); ctx.stroke(); }
    else if(it.t==="line"){ ctx.beginPath(); ctx.moveTo(it.a[0]*W,it.a[1]*H); ctx.lineTo(it.b[0]*W,it.b[1]*H); ctx.stroke(); }
    else if(it.t==="rect"){ const x=Math.min(it.a[0],it.b[0])*W, y=Math.min(it.a[1],it.b[1])*H; ctx.strokeRect(x,y,Math.abs(it.b[0]-it.a[0])*W,Math.abs(it.b[1]-it.a[1])*H); }
    else if(it.t==="text"){ ctx.font=`600 ${Math.round(H*0.05)}px Roboto, Arial, sans-serif`; ctx.textBaseline="middle"; ctx.fillText(it.s,it.x*W,it.y*H); }
  }
}
function skSnap(a,b){ // rechte lijn: bijna horizontaal/verticaal wordt exact
  const dx=Math.abs(b[0]-a[0]), dy=Math.abs(b[1]-a[1])*0.75;
  if(dy<dx*0.15) return [b[0],a[1]]; if(dx<dy*0.15) return [a[0],b[1]]; return b;
}
function initSketch(){
  const cv=$("#skcanvas"); if(!cv) return;
  const wrap=$("#skwrap"); const p=P(); const items=skItems(p);
  const dpr=window.devicePixelRatio||1;
  const size=()=>{ const w=wrap.clientWidth, h=Math.round(w*3/4); cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.width=w+"px"; cv.style.height=h+"px"; redraw(); };
  const ctx=cv.getContext("2d");
  const redraw=(extra)=>{ skDraw(ctx,cv.width,cv.height,extra?items.concat([extra]):items,true); };
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]; };
  let activeId=null;
  cv.onpointerdown=e=>{
    if(activeId!==null) return;
    const pt=pos(e);
    if(SK.tool==="text"){ const s=($("#sktext")||{}).value||""; if(!s.trim()){ toast("Typ eerst de tekst, tik dan in de schets."); $("#sktext")&&$("#sktext").focus(); return; }
      items.push({t:"text",s:s.trim(),x:pt[0],y:pt[1],c:SK.color}); $("#sktext").value=""; redraw(); scheduleSave(); return; }
    activeId=e.pointerId; try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    SK.drawing = SK.tool==="pen" ? {t:"pen",pts:[pt],c:SK.color,w:SK.width} : {t:SK.tool,a:pt,b:pt,c:SK.color,w:SK.width};
    redraw(SK.drawing); e.preventDefault();
  };
  cv.onpointermove=e=>{
    if(e.pointerId!==activeId||!SK.drawing) return;
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    if(SK.drawing.t==="pen") for(const ev of evs) SK.drawing.pts.push(pos(ev));
    else SK.drawing.b = SK.drawing.t==="line" ? skSnap(SK.drawing.a,pos(e)) : pos(e);
    redraw(SK.drawing); e.preventDefault();
  };
  const end=e=>{ if(e.pointerId!==activeId) return; activeId=null;
    if(SK.drawing){ const d=SK.drawing; SK.drawing=null;
      const tiny = d.t!=="pen" && Math.abs(d.a[0]-d.b[0])<0.005 && Math.abs(d.a[1]-d.b[1])<0.005;
      if(!tiny){ if(d.t==="pen") d.pts=d.pts.map(q=>[+q[0].toFixed(4),+q[1].toFixed(4)]); items.push(d); scheduleSave(); } redraw(); } };
  cv.onpointerup=end; cv.onpointercancel=end;

}

const MM = 72/25.4;
const WIN = {"€":128,"‚":130,"„":132,"…":133,"–":150,"—":151,"‘":145,"’":146,"“":147,"”":148,"•":149,"·":183,"×":215};
function pdfStr(s){
  let o=""; for(const ch of String(s==null?"":s).replace(/≠/g,"<>").replace(/−/g,"-")){ let c=ch.charCodeAt(0);
    if(WIN[ch]!==undefined) c=WIN[ch]; else if(c>255) c=63;
    if(c===40||c===41||c===92) o+="\\"+String.fromCharCode(c);
    else if(c<32||c>126) o+="\\"+c.toString(8).padStart(3,"0"); else o+=String.fromCharCode(c); }
  return "("+o+")";
}
class MiniPdf{
  constructor(){ this.W=297; this.H=210; this.pages=[]; this.images=[]; this.cur=null; }
  addPage(){ this.cur={ops:[],imgs:[]}; this.pages.push(this.cur); }
  y(v){ return (this.H-v)*MM; }
  fill(rgb){ this.cur.ops.push(rgb.map(v=>(v/255).toFixed(3)).join(" ")+" rg"); }
  stroke(rgb){ this.cur.ops.push(rgb.map(v=>(v/255).toFixed(3)).join(" ")+" RG"); }
  rect(x,y,w,h,rgb){ this.fill(rgb); this.cur.ops.push(`${(x*MM).toFixed(2)} ${this.y(y+h).toFixed(2)} ${(w*MM).toFixed(2)} ${(h*MM).toFixed(2)} re f`); }
  line(x1,y1,x2,y2,rgb,wd){ this.stroke(rgb||[200,200,200]); this.cur.ops.push(`${(wd||0.3)*MM} w ${(x1*MM).toFixed(2)} ${this.y(y1).toFixed(2)} m ${(x2*MM).toFixed(2)} ${this.y(y2).toFixed(2)} l S`); }
  text(x,y,s,size,bold,rgb){ this.fill(rgb||[28,43,58]); this.cur.ops.push(`BT /${bold?"F2":"F1"} ${size} Tf ${(x*MM).toFixed(2)} ${this.y(y).toFixed(2)} Td ${pdfStr(s)} Tj ET`); }
  wrap(s,size,maxMm){ const maxCh=Math.max(10,Math.floor(maxMm*MM/(size*0.5))); const out=[];
    String(s).split("\n").forEach(par=>{ let line=""; par.split(" ").forEach(w=>{ if((line+" "+w).trim().length>maxCh){ if(line) out.push(line); line=w; } else line=(line?line+" ":"")+w; }); out.push(line); });
    return out; }
  image(bytes,pxW,pxH,x,y,w,h){ const idx=this.images.length; this.images.push({bytes,pxW,pxH}); this.cur.imgs.push(idx);
    this.cur.ops.push(`q ${(w*MM).toFixed(2)} 0 0 ${(h*MM).toFixed(2)} ${(x*MM).toFixed(2)} ${this.y(y+h).toFixed(2)} cm /Im${idx} Do Q`); }
  output(){
    const enc=new TextEncoder(); const parts=[]; let len=0; const offs=[];
    const push=b=>{ const u=typeof b==="string"?enc.encode(b):b; parts.push(u); len+=u.length; };
    const objs=[]; const add=o=>{ objs.push(o); return objs.length; };
    const fontR=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    const fontB=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
    const imgIds=this.images.map(im=>add({head:`<< /Type /XObject /Subtype /Image /Width ${im.pxW} /Height ${im.pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>`,bytes:im.bytes}));
    const pagesId=objs.length+this.pages.length*2+1;
    const pageIds=[];
    this.pages.forEach(pg=>{
      const content=pg.ops.join("\n"); const cb=enc.encode(content);
      const cid=add({head:`<< /Length ${cb.length} >>`,bytes:cb});
      const xo=pg.imgs.map(i=>`/Im${i} ${imgIds[i]} 0 R`).join(" ");
      pageIds.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${(this.W*MM).toFixed(2)} ${(this.H*MM).toFixed(2)}] /Resources << /Font << /F1 ${fontR} 0 R /F2 ${fontB} 0 R >> /XObject << ${xo} >> >> /Contents ${cid} 0 R >>`));
    });
    const pid=add(`<< /Type /Pages /Kids [${pageIds.map(i=>i+" 0 R").join(" ")}] /Count ${pageIds.length} >>`);
    const cat=add(`<< /Type /Catalog /Pages ${pid} 0 R >>`);
    push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
    objs.forEach((o,i)=>{ offs.push(len); push(`${i+1} 0 obj\n`);
      if(typeof o==="string") push(o+"\n"); else { push(o.head+"\nstream\n"); push(o.bytes); push("\nendstream\n"); }
      push("endobj\n"); });
    const xref=len;
    push(`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join(""));
    push(`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(parts,{type:"application/pdf"});
  }
}

/* ---------- acties ---------- */
async function openWerf(id){
  const w=await get("werf:"+id); if(!w){ toast("Deze werf werd niet gevonden op deze tablet."); return; }
  werf=w; curPos=0; step="maten"; view="pos"; render();
}
function addPos(kind){
  const last=werf.posities[werf.posities.length-1];
  const nr = last && /^\d+$/.test(last.nr) ? String(+last.nr+1) : String(werf.posities.length+1);
  werf.posities.push(newPos(kind,nr)); curPos=werf.posities.length-1; step="maten"; scheduleSave(); render();
  setTimeout(()=>{ const f=document.querySelector("[data-m]"); f&&f.focus(); },60);
}
document.addEventListener("click", async e=>{
  const t=e.target.closest("button,[data-check],[data-acc],tr[data-gopos]"); if(!t) return;
  const ds=t.dataset;
  if(t.id==="nav-werven"){ view="werven"; render(); return; }
  if(t.id==="nav-werf"){ view="werf"; render(); return; }
  if(t.id==="nav-pos"){ view="pos"; render(); return; }
  if(t.id==="nav-ov"){ view="ov"; render(); return; }
  if(t.id==="newwerf"){ werf=newWerf(); scheduleSave(); view="werf"; render(); return; }
  if(t.id==="importbtn"){ $("#importfile").click(); return; }
  if(t.id==="offwerf"||t.id==="offload"){ const fi=$("#offin"); fi.dataset.mode=t.id; fi.click(); return; }
  if(ds.open){ openWerf(ds.open); return; }
  if(ds.check!==undefined){ const k=ds.check; werf.check=werf.check.includes(k)?werf.check.filter(x=>x!==k):[...werf.check,k]; t.setAttribute("aria-pressed",werf.check.includes(k)); scheduleSave(); return; }
  if(t.id==="delwerf"){ const c=$("#delconfirm"); if(t.dataset.arm!=="1"){ t.dataset.arm="1"; t.textContent="Tik nogmaals om te verwijderen"; c.textContent="Foto's en maten van deze werf gaan verloren."; return; }
    for(const p of werf.posities) for(const id of p.photos) await del("photo:"+id);
    await del("werf:"+werf.id); index=index.filter(x=>x.id!==werf.id); await put("index",index); werf=null; view="werven"; render(); toast("Werf verwijderd"); return; }
  if(!werf) return;
  const p=P();
  if(ds.pos!==undefined){ curPos=+ds.pos; render(); return; }
  if(ds.sktool){ SK.tool=ds.sktool; document.querySelectorAll("[data-sktool]").forEach(b=>b.setAttribute("aria-pressed",b===t)); const tw=$("#sktextwrap"); if(tw){ tw.hidden=SK.tool!=="text"; if(SK.tool==="text") $("#sktext").focus(); } return; }
  if(t.id==="cpprev"){ copyPrev(p); return; }
  if(t.id==="cpall"){ copyAll(p); return; }
  if(t.id==="donebtn"){
    if(p.done){ p.done=false; scheduleSave(); render(); toast("Positie weer open"); return; }
    const c=checkPos(p);
    if(c.miss.length && t.dataset.arm!=="1"){ t.dataset.arm="1"; t.textContent=`Toch klaar? (${c.miss.length} ontbreekt)`; toast("Ontbreekt: "+c.miss.join(", ")); return; }
    p.done=true; scheduleSave(); render(); toast("Positie gemarkeerd als klaar"); return; }
  if(t.id==="sigclear"){ werf.sign={naam:($("#signnaam")||{}).value||"",datum:($("#signdatum")||{}).value||""}; scheduleSave(); render(); return; }
  if(ds.skcolor){ SK.color=ds.skcolor; document.querySelectorAll("[data-skcolor]").forEach(b=>b.setAttribute("aria-pressed",b===t)); return; }
  if(ds.skwidth){ SK.width=+ds.skwidth; document.querySelectorAll("[data-skwidth]").forEach(b=>b.setAttribute("aria-pressed",b===t)); return; }
  if(t.id==="skundo"){ const it=skItems(p); if(it.length){ it.pop(); scheduleSave(); initSketch(); } else toast("Niets om ongedaan te maken"); return; }
  if(t.id==="skframe"){ skFrame(p); scheduleSave(); initSketch(); return; }
  if(t.id==="skclear"){ if(t.dataset.arm!=="1"){ t.dataset.arm="1"; t.textContent="Tik nogmaals om te wissen"; setTimeout(()=>{ if(t.isConnected){ t.dataset.arm=""; t.textContent="Alles wissen"; } },3000); return; }
    p.sketch={items:[]}; scheduleSave(); render(); toast("Schets gewist"); return; }
  if(ds.addpos){ addPos(ds.addpos); return; }
  if(ds.step){ step=ds.step; render(); return; }
  if(ds.gopos!==undefined){ curPos=+ds.gopos; step="maten"; view="pos"; render(); return; }
  if(t.id==="prevpos"&&curPos>0){ curPos--; render(); window.scrollTo(0,0); return; }
  if(t.id==="nextpos"){ if(curPos<werf.posities.length-1){ curPos++; step="maten"; render(); window.scrollTo(0,0); } else addPos(p.kind); return; }
  if(ds.seg){ const k=ds.seg; let v=ds.val; if(k==="vloerAf") v = v==="Ja"?true:"nee";
    const cur = p[k]; p[k] = (cur===v)?"":v;
    t.parentElement.querySelectorAll("[data-seg]").forEach(b=>b.setAttribute("aria-pressed",b===t&&p[k]!=="")); scheduleSave(); return; }
  if(ds.multi){ const g=ds.multi, v=ds.val; p[g]=p[g].includes(v)?p[g].filter(x=>x!==v):[...p[g],v]; t.setAttribute("aria-pressed",p[g].includes(v)); scheduleSave(); return; }
  if(ds.toggle){ p[ds.toggle]=!p[ds.toggle]; t.setAttribute("aria-pressed",!!p[ds.toggle]); scheduleSave(); if(ds.toggle==="done") toast(p.done?"Positie gemarkeerd als klaar":"Positie weer open"); return; }
  if(ds.acc){ const k=ds.acc; p.acc=p.acc.includes(k)?p.acc.filter(x=>x!==k):[...p.acc,k]; t.setAttribute("aria-pressed",p.acc.includes(k)); scheduleSave(); return; }
  if(ds.take){ const k=ds.take; const b=minOf(p[k].b), h=minOf(p[k].h); if(b===""&&h===""){ toast("Nog geen "+k.toUpperCase()+"-maten ingevuld"); return; }
    if(b!=="") p.pmB=String(b); if(h!=="") p.pmH=String(h); document.querySelector('[data-p="pmB"]').value=p.pmB; document.querySelector('[data-p="pmH"]').value=p.pmH; scheduleSave(); return; }
  if(ds.delphoto){ p.photos=p.photos.filter(x=>x!==ds.delphoto); await del("photo:"+ds.delphoto); t.closest(".photo").remove(); scheduleSave(); return; }
  if(t.id==="delpos"){ if(t.dataset.arm!=="1"){ t.dataset.arm="1"; t.textContent="Tik nogmaals om te verwijderen"; return; }
    for(const id of p.photos) await del("photo:"+id); werf.posities.splice(curPos,1); if(!werf.posities.length) werf.posities.push(newPos("raam",1));
    curPos=Math.max(0,curPos-1); scheduleSave(); render(); toast("Positie verwijderd"); return; }
  if(t.id==="mkpdf"||t.id==="sharepdf"){ const lab=t.textContent; t.disabled=true; t.textContent="PDF wordt gemaakt…";
    try{ const blob=await buildPdf(); if(t.id==="mkpdf") saveBlob(blob,fname(".pdf")); else await shareBlob(blob,fname(".pdf")); }
    catch(err){ toast("De PDF kon niet gemaakt worden."); } finally{ t.disabled=false; t.textContent=lab; } return; }
  if(t.id==="mkjson"){ saveBlob(await backupBlob(),fname(" reservekopie.json")); return; }
});
document.addEventListener("keydown", e=>{
  const t=e.target;
  if((e.key==="Enter"||e.key==="Tab") && t.matches && t.matches("[data-m]") && !e.shiftKey){
    const all=[...document.querySelectorAll("[data-m]")]; const i=all.indexOf(t);
    e.preventDefault();
    const nx = i<all.length-1 ? all[i+1] : document.querySelector('[data-p="pmB"]'); if(nx){ nx.focus(); try{ nx.select(); }catch(err){} }
  }
  if((e.key===" "||e.key==="Enter") && t.matches && t.matches("[data-check],[data-acc]")){ e.preventDefault(); t.click(); }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if((t.id==="signnaam"||t.id==="signdatum") && werf){ werf.sign=Object.assign({},werf.sign,{[t.id==="signnaam"?"naam":"datum"]:t.value}); scheduleSave(); return; }
  if(t.dataset.w!==undefined && werf){ werf[t.dataset.w]=t.value; scheduleSave(); if(t.dataset.w==="klant"||t.dataset.w==="offerte") $("#werfname").textContent=(werf.klant||"Nieuwe werf")+(werf.offerte?" · "+werf.offerte:""); return; }
  if(t.dataset.p!==undefined && werf){ setPath(P(),t.dataset.p,t.value); scheduleSave(); updateCalc();
    if(t.dataset.p==="nr"){ const chip=document.querySelector(`.chip[data-pos="${curPos}"]`); if(chip) chip.lastChild.textContent=(t.value||curPos+1)+(P().kind==="deur"?" D":""); } }
});
document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.id==="photoin" && t.files && werf){
    const p=P(); let n=0;
    for(const f of t.files){ try{ const d=await shrink(f); const id=uid(); await put("photo:"+id,d); p.photos.push(id); n++; }catch(err){ toast("Deze foto kon niet gelezen worden."); } }
    t.value=""; scheduleSave(); render(); if(n) toast(n===1?"Foto toegevoegd":n+" foto's toegevoegd");
  }
  if(t.id==="offin" && t.files && t.files[0]){
    const mode=t.dataset.mode; const file=t.files[0]; t.value="";
    toast("Offerte wordt gelezen…");
    try{ const res=await readOffertePdf(file);
      const target = mode==="offload" && werf ? werf : null;
      werf = offerteToWerf(res, target); if(!target){ werf.datum=new Date().toISOString().slice(0,10); }
      const n=res.elements.reduce((a,e)=>a+e.hoev,0);
      curPos=0; step="maten"; view="werf"; scheduleSave(); render();
      toast(`${n} posities ingeladen uit ${res.offerte||"de offerte"}`);
    }catch(err){ toast("Deze PDF kon niet als offerte gelezen worden. Gebruik de offerte-PDF uit WinPro."); }
    return;
  }
  if(t.id==="importfile" && t.files && t.files[0]){
    try{ const j=JSON.parse(await t.files[0].text()); if(!j.werf||!j.werf.posities) throw 0;
      for(const [id,d] of Object.entries(j.photos||{})) await put("photo:"+id,d);
      werf=j.werf; scheduleSave(); view="werf"; render(); toast("Reservekopie teruggezet");
    }catch(err){ toast("Dit bestand is geen geldige reservekopie."); }
    t.value="";
  }
});

/* bij aantikken van een maatvak: bestaande waarde selecteren, zodat de DISTO ze vervangt */
document.addEventListener("focusin", e=>{ const t=e.target; if(t.matches && t.matches("input.num")) { try{ t.select(); }catch(err){} } });
/* scherm aan houden tijdens het meten */
async function wake(){ try{ if(navigator.wakeLock && document.visibilityState==="visible") await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",wake);

/* ---------- start ---------- */
(async function boot(){
  index = (await get("index")) || [];
  if(!index.length){ const ex=exampleWerf(); await put("werf:"+ex.id,ex); index=[{id:ex.id,klant:ex.klant,offerte:ex.offerte,updated:ex.updated,example:true,n:ex.posities.length}]; await put("index",index); }
  const last = await get("last");
  if(last && last.werf){ const w=await get("werf:"+last.werf); if(w){ werf=w; curPos=Math.min(last.pos||0,w.posities.length-1); step=last.step||"maten"; view=last.view||"pos"; } }
  if(!werf){ const w=await get("werf:"+index[0].id); werf=w; view="pos"; step="maten"; }
  render(); wake();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
})();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
})();
</script>
